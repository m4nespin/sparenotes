name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test -n "$version"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "Release signing secrets are not configured"
            exit 1
          fi
          umask 077
          install -d -m 700 .release-signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .release-signing/sparenotes-release.p12
          printf 'storeFile=.release-signing/sparenotes-release.p12\nstorePassword=%s\nkeyAlias=sparenotes\nkeyPassword=%s\n' \
            "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEYSTORE_PASSWORD" \
            > .release-signing/keystore.properties

      - name: Build signed APK
        run: bash ./gradlew lintRelease testDebugUnitTest assembleRelease

      - name: Verify and package APK
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -f "$apk"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir release
          output="SpareNotes-${GITHUB_REF_NAME}.apk"
          cp "$apk" "release/$output"
          cd release
          sha256sum "$output" > "$output.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
