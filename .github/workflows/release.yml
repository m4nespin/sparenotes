name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Validate release tag
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test -n "$version"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "Release signing secrets are not configured"
            exit 1
          fi
          umask 077
          install -d -m 700 .release-signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .release-signing/sparenotes-release.p12
          printf 'storeFile=.release-signing/sparenotes-release.p12\nstorePassword=%s\nkeyAlias=sparenotes\nkeyPassword=%s\n' \
            "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEYSTORE_PASSWORD" \
            > .release-signing/keystore.properties

      - name: Build signed APK
        run: bash ./gradlew lintRelease testDebugUnitTest assembleRelease

      - name: Verify and package APK
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -f "$apk"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir release
          output="SpareNotes-${GITHUB_REF_NAME}.apk"
          cp "$apk" "release/$output"
          cd release
          sha256sum "$output" > "$output.sha256"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          bash ./gradlew --stop || true
          rm -rf .release-signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download packaged APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
